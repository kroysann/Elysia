:root { color-scheme:dark; --bg:#0d0c14; --surface:#161520; --surface2:#1c1a29; --surface3:#242231; --stroke:rgba(255,255,255,.085); --text:#f6f3ff; --muted:#9791a9; --accent:#b18aff; --accent2:#e79fe4; --glow:rgba(160,109,252,.23); --shadow:0 22px 70px #04020d80; --radius:21px; }
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;font-family:'Manrope',Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);font-size:14px;overflow:hidden}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.38;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}a{color:inherit}button{border:0}.ico{display:inline-flex;width:21px;height:21px;align-items:center;justify-content:center;flex:0 0 auto}.ico svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.ambient{pointer-events:none;position:fixed;border-radius:100%;filter:blur(110px);opacity:.5;z-index:0}.ambient-a{width:570px;height:570px;left:20%;top:-400px;background:#462363}.ambient-b{width:450px;height:450px;right:-330px;bottom:0;background:#38215e}

/* ELYSIA 2 — мягкие персональные оттенки и расширенные настройки */
:root{--accent:#bfa2ee;--accent2:#e7adce;--accent-muted:color-mix(in srgb,var(--accent) 23%,transparent)}
.brand-mark,.btn.accent,.quick-art,.playlist-art{background:linear-gradient(130deg,var(--accent),var(--accent2))}
.brand-mark{box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 33%,transparent)}
.hero{background:radial-gradient(ellipse at 85% 46%,color-mix(in srgb,var(--accent) 45%,#252037) 0%,transparent 60%),linear-gradient(120deg,#30233d,#181524 80%);background-position:center;background-size:cover}
.hero.has-photo{background-position:center;background-size:cover}
.hero.has-photo .hero-shape{opacity:.15}
.hero h1{max-width:520px;overflow-wrap:break-word}
.hero.has-photo h1{text-shadow:0 3px 26px #02020a99}
.hero .eyebrow,.eyebrow{color:var(--accent)}
.hero-shape{border-top-color:var(--accent);border-left-color:var(--accent);border-right-color:var(--accent2);box-shadow:inset 4px 9px 35px var(--glow),0 0 90px var(--glow)}
.hero-shape:after{border-color:color-mix(in srgb,var(--accent) 36%,transparent);box-shadow:0 0 40px var(--glow)}
.btn.accent,.filter-tab.active,.modal-tab.active{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#1a1420}
.nav-item.active{color:var(--accent);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 20%,#211c30),#211c30)}
.quick-art{color:#20142b}.quick-art.orange{background:linear-gradient(135deg,var(--accent2),#d991ae)}.quick-art.blue{background:linear-gradient(130deg,#8ea7d2,var(--accent))}
.section-heading .text-btn,.text-btn,.hint-banner .ico,.tiny-add,.icon-button:hover,.icon-button.active,.track-row.playing .track-num{color:var(--accent)}
.play-button{background:linear-gradient(130deg,var(--accent),var(--accent2));color:#20152b}
.source-pill{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,#1d1a2a)}
input[type=range]{accent-color:var(--accent)}

function icon(name){return `<span class="ico" data-icon="${esc(name)}"></span>`;}

const id = () => (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function' ? crypto.randomUUID() : `${Date.now()}_${Math.random().toString(36).slice(2)}`);
const formatTime = value => {if(!Number.isFinite(value)||value<0)return '0:00';let seconds=Math.floor(value);return `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;};

function saveSettings(){try{localStorage.setItem('elysia-settings-v2',JSON.stringify(settings));}catch{toast('Не получилось сохранить настройки',true);}}
function applySettings(){const root=document.documentElement;
 root.style.setProperty('--accent',settings.accent);root.style.setProperty('--accent2',settings.accent2);
 root.style.setProperty('--glow',`color-mix(in srgb, ${settings.accent} 28%, transparent)`);

 root.style.setProperty('--banner-dim',String(settings.bannerDim/100));
 root.style.setProperty('--wallpaper-dim',String(settings.wallpaperDim/100));
 root.style.setProperty('--wallpaper-blur',String(settings.wallpaperBlur)+'px');

 audio.volume=settings.volume/100;
 ['volumeSlider','mobileVolumeSlider','settingsVolume'].forEach(k=>{const e=document.getElementById(k);if(e)e.value=settings.volume;});

}

function imageData(file,kind='cover'){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/'))return reject(new Error('Выбери изображение JPG, PNG или WebP'));if(file.size>10*1024*1024)return reject(new Error('Размер картинки не должен превышать 10 МБ'));const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{try{const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');if(!ctx)throw Error('Нет поддержки Canvas');const target=kind==='hero'?{w:1700,h:700}:kind==='wallpaper'?{w:1600,h:1000}:{w:650,h:650};canvas.width=target.w;canvas.height=target.h;const scale=Math.max(target.w/im.width,target.h/im.height),w=im.width*scale,h=im.height*scale;ctx.drawImage(im,(target.w-w)/2,(target.h-h)/2,w,h);resolve(canvas.toDataURL('image/jpeg',.83));}catch(e){reject(e);}finally{URL.revokeObjectURL(url);}};im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Не удалось прочитать картинку'));};im.src=url;});}

// IndexedDB when available; session-only fallback for Android file:// or blocked storage.
const fileURLCache=new Map();
const memoryStores=Object.fromEntries(['tracks','files','playlists','assets'].map(x=>[x,new Map()]));
let temporaryMode=false;
function database(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return;}let r;try{r=indexedDB.open('AuraMusicDB',2);}catch(e){reject(e);return;}let done=false;const timeout=setTimeout(()=>{if(!done){done=true;reject(new Error('IndexedDB did not respond'));}},3500);const finish=(ok,v)=>{if(done)return;done=true;clearTimeout(timeout);ok?resolve(v):reject(v);};r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('tracks'))d.createObjectStore('tracks',{keyPath:'id'});if(!d.objectStoreNames.contains('files'))d.createObjectStore('files');if(!d.objectStoreNames.contains('playlists'))d.createObjectStore('playlists',{keyPath:'id'});if(!d.objectStoreNames.contains('assets'))d.createObjectStore('assets');};r.onsuccess=()=>finish(true,r.result);r.onerror=()=>finish(false,r.error||Error('Database failed'));r.onblocked=()=>finish(false,Error('Database blocked'));});}
function all(store){if(temporaryMode)return Promise.resolve([...memoryStores[store].values()]);return new Promise((resolve,reject)=>{const r=db.transaction(store,'readonly').objectStore(store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function get(store,key){if(temporaryMode)return Promise.resolve(memoryStores[store].get(key));return new Promise((resolve,reject)=>{const r=db.transaction(store,'readonly').objectStore(store).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function put(store,value,key){if(temporaryMode){memoryStores[store].set(key===undefined?value.id:key,value);return Promise.resolve();}return new Promise((resolve,reject)=>{const r=db.transaction(store,'readwrite').objectStore(store).put(value,...(key===undefined?[]:[key]));r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error);});}
function del(store,key){if(temporaryMode){memoryStores[store].delete(key);return Promise.resolve();}return new Promise((resolve,reject)=>{const r=db.transaction(store,'readwrite').objectStore(store).delete(key);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error);});}
async function warmAudioFiles(){
 for(const t of tracks.filter(t=>t.source==='file')){
  try{const blob=await get('files',t.id);if(blob&&!fileURLCache.has(t.id))fileURLCache.set(t.id,URL.createObjectURL(blob));}catch(e){console.warn('Cannot cache track',t.title,e);}
 }
}

function coverGradient(t){const gradients=['linear-gradient(145deg,#754ba3,#ef85b9)','linear-gradient(145deg,#485285,#af83d9)','linear-gradient(145deg,#9b527c,#db9074)','linear-gradient(145deg,#6f4677,#b29cde)','linear-gradient(145deg,#37517c,#6c97c6)'];let s=Array.from(t.title).reduce((a,c)=>a+c.charCodeAt(0),0);return gradients[s%gradients.length];}

function parseID3(arrayBuffer){try{const b=new Uint8Array(arrayBuffer),v=new DataView(arrayBuffer);if(String.fromCharCode(...b.slice(0,3))!=='ID3')return {};const version=b[3];if(![3,4].includes(version))return {};let size=(b[6]<<21)|(b[7]<<14)|(b[8]<<7)|b[9],pos=10;const result={};while(pos+10<b.length&&pos<size+10){const frame=String.fromCharCode(...b.slice(pos,pos+4));if(!/^[A-Z0-9]{4}$/.test(frame))break;let n=version===4?((b[pos+4]<<21)|(b[pos+5]<<14)|(b[pos+6]<<7)|b[pos+7]):v.getUint32(pos+4);if(n<=0||n>4e6||pos+10+n>b.length)break;let body=b.subarray(pos+10,pos+10+n);if(['TIT2','TPE1','TALB'].includes(frame)&&n>1){const encoding=body[0],data=body.subarray(1),charset=encoding===1?'utf-16':encoding===2?'utf-16be':encoding===3?'utf-8':'iso-8859-1';let text;try{text=new TextDecoder(charset).decode(data).replace(/\0/g,'').replace(/^\ufeff/,'').trim();}catch{text='';}if(frame==='TIT2')result.title=text;if(frame==='TPE1')result.artist=text;}
 if(frame==='APIC'&&n<1700000&&n>20){let p=1;while(p<body.length&&body[p]!==0)p++;const mime=new TextDecoder().decode(body.slice(1,p));p+=2;const unicode=body[0]===1||body[0]===2;while(p<body.length&&body[p]!==0)p+=unicode?2:1;p+=unicode?2:1;if(p<body.length&&/^image\/(jpeg|png|webp)$/i.test(mime)){const imageData=body.slice(p);if(imageData.length<1000000){let binary='';for(let i=0;i<imageData.length;i+=32768)binary+=String.fromCharCode(...imageData.slice(i,i+32768));result.cover=`data:${mime};base64,${btoa(binary)}`;}}}
 pos+=10+n;}return result;}catch{return {};}}
async function importFiles(fileList){const files=Array.from(fileList||[]).filter(f=>f.type.startsWith('audio/')||/\.(mp3|flac|wav|m4a|aac|ogg|oga|opus|webm)$/i.test(f.name));if(!files.length){toast('Выбери аудиофайлы, например MP3, FLAC или WAV',true);return;}let count=0,fail=0;closeModal();toast(`Добавляю ${files.length} аудиофайлов...`);for(let file of files){try{let meta={};if(/\.mp3$/i.test(file.name)){meta=parseID3(await file.slice(0,Math.min(file.size,1800000)).arrayBuffer());}const track={id:id(),source:'file',url:'',embedUrl:'',title:(meta.title||basename(file.name)).slice(0,120),artist:(meta.artist||'Неизвестный исполнитель').slice(0,120),cover:meta.cover||'',duration:0,liked:false,addedAt:Date.now()+count,fileName:file.name,lyrics:''};await put('files',file,track.id);await saveTrack(track);tracks.unshift(track);fileURLCache.set(track.id,URL.createObjectURL(file));count++;}catch(e){fail++;console.error('File import:',e);}}render();toast(`Добавлено: ${count}${fail?`; ошибок: ${fail}`:''}`);}

document.addEventListener('dragover',e=>{const row=e.target.closest('.track-row[draggable]');if(!row||!draggedTrackId)return;e.preventDefault();e.dataTransfer.dropEffect='move';row.classList.add('drag-target');});
document.addEventListener('dragleave',e=>{const row=e.target.closest('.track-row[draggable]');if(row)row.classList.remove('drag-target');});
document.addEventListener('drop',async e=>{const row=e.target.closest('.track-row[draggable]');if(!row||!draggedTrackId)return;e.preventDefault();e.stopPropagation();const from=draggedTrackId;draggedTrackId=null;await reorderTracks(from,row.dataset.track);});
document.addEventListener('dragend',()=>{draggedTrackId=null;document.querySelectorAll('.dragging,.drag-target').forEach(x=>x.classList.remove('dragging','drag-target'));});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();drawer(false);if(typeof closeMobilePlayer==='function')closeMobilePlayer();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#searchInput').focus();}if(e.code==='Space'&&!['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)&&!$('#modalBackdrop').hidden){return;}if(e.code==='Space'&&!['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)&&$('#modalBackdrop').hidden){e.preventDefault();const t=findTrack(currentId);if(t&&['file','direct'].includes(t.source))audio.paused?audio.play():audio.pause();}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#installBtn').hidden=false;});$('#installBtn').addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('#installBtn').hidden=true;});window.addEventListener('appinstalled',()=>{$('#installBtn').hidden=true;toast('ELYSIA установлена!');});
window.addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files'))e.preventDefault();});window.addEventListener('drop',e=>{if(e.dataTransfer?.files?.length&&!e.target.closest('.upload-zone')){e.preventDefault();importFiles(e.dataTransfer.files);}});
async function init(){
 iconify();loadSettings();applySettings();
 try{db=await database();}catch(e){console.warn('Offline temporary storage:',e);temporaryMode=true;db={memory:true};}
 try{[tracks,playlists,heroImage,wallpaperImage]=await Promise.all([all('tracks'),all('playlists'),get('assets','hero'),get('assets','wallpaper')]);}catch(e){console.warn('Read storage failed',e);temporaryMode=true;tracks=[];playlists=[];}
 heroImage=heroImage||'';wallpaperImage=wallpaperImage||'';applySettings();
 if(typeof loadMobileAssets==='function')await loadMobileAssets();
 let stored='';try{stored=localStorage.getItem('elysia-current')||localStorage.getItem('aura-current')||'';}catch{}
 if(tracks.some(t=>t.id===stored)){currentId=stored;let t=findTrack(currentId);if(t&&['file','direct'].includes(t.source))openNativeInfo(t);}
 render();
 // Load blobs in advance so mobile Chrome can play on the first tap (trusted gesture).
 warmAudioFiles().catch(console.warn);
 if(temporaryMode)toast('Временный режим: музыка доступна до закрытия страницы. Для постоянного хранения открой сайт по HTTPS.',true);
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(console.warn);
}
init();

</script><script defer>
'use strict';
// ELYSIA Mobile — отдельный интерфейс поверх общей библиотеки ELYSIA 3.0.
// Хранение локально: та же IndexedDB AuraMusicDB (совместимость с предыдущими версиями).
let mobileAvatar='',mobileBackdrop='';
let mobileProfileName='Мой профиль';
let mobileLastCoverKey='', mobileLastPlaybackState='';
try{mobileProfileName=(localStorage.getItem('elysia-mobile-profile')||'Мой профиль').slice(0,36);}catch{}

async function loadMobileAssets(){
 try{
   [mobileAvatar,mobileBackdrop]=await Promise.all([get('assets','mobile-avatar'),get('assets','mobile-profile-background')]);
   mobileAvatar=mobileAvatar||'';mobileBackdrop=mobileBackdrop||'';
 }catch(e){console.warn('Профиль не загружен',e);}
}
function mobileArt(t){return t?.cover?`<img src="${esc(t.cover)}" alt="">`:`<span class="ico" data-icon="${t?.source==='youtube'?'play':'music'}"></span>`;}
function mobileHomeMarkup(){
 const recent=tracks.slice().sort((a,b)=>b.addedAt-a.addedAt).slice(0,5);
 const playlistMarkup=playlists.slice(0,8).map((p,i)=>`
  <button class="mobile-playlist-card" data-page="playlist:${esc(p.id)}">
   <div class="mobile-pl-art shade-${i%5}">${p.cover?`<img src="${esc(p.cover)}" alt="">`:icon(p.external?'link':'music')}</div>
   <strong>${esc(p.name)}</strong><small>${p.external?'Из музыкального сервиса':`${p.trackIds.length} треков`}</small>
  </button>`).join('');
 const recentMarkup=recent.map(t=>`<div class="mobile-song ${t.id===currentId?'is-current':''}">
  <button class="mobile-song-art" data-action="edit-cover" data-id="${esc(t.id)}" aria-label="Изменить обложку ${esc(t.title)}" style="background:${coverGradient(t)}">${mobileArt(t)}</button>
  <button class="mobile-song-info" data-action="play" data-id="${esc(t.id)}"><strong>${esc(t.title)}</strong><small>${esc(t.artist)}</small></button>
  <button class="mobile-song-more" data-action="options" data-id="${esc(t.id)}" aria-label="Действия с треком">${icon('more')}</button>
 </div>`).join('');
 return `<div class="mobile-home">
 <div class="mobile-content-heading"><h2>Недавно добавлено</h2><button data-page="library" aria-label="Все треки">Все ${icon('chevron-right')}</button></div>
 ${recent.length?`<div class="mobile-song-list">${recentMarkup}</div>`:`<div class="mobile-empty-music"><span class="mobile-empty-icon">${icon('music')}</span><h3>Пусть музыка начнётся</h3><p>Добавь свои песни с телефона или сохрани ссылку на трек.</p><button class="btn accent" data-action="add">${icon('plus')} Добавить музыку</button></div>`}
 <div class="mobile-content-heading"><h2>Мои плейлисты</h2><button data-action="create-playlist" aria-label="Создать плейлист">${icon('plus')} Создать</button></div>
 <div class="mobile-playlist-strip">${playlistMarkup||`<button class="mobile-playlist-card new-playlist" data-action="create-playlist"><div class="mobile-pl-art">${icon('plus')}</div><strong>Первый плейлист</strong><small>Создать коллекцию</small></button>`}</div>
 <div class="mobile-home-footnote">ELYSIA · твоя музыка, твоя атмосфера</div>
 </div>`;
}
function mobileSettingsMarkup(){
 const avatar=mobileAvatar?`<img src="${esc(mobileAvatar)}" alt="Мой аватар">`:`${icon('user')}`;
 const playlistList=playlists.slice(0,6).map((p,i)=>`<button class="mobile-settings-playlist" data-page="playlist:${esc(p.id)}"><span class="settings-pl-thumb shade-${i%5}">${p.cover?`<img src="${esc(p.cover)}" alt="">`:icon('music')}</span><span><b>${esc(p.name)}</b><small>${p.external?'Сервисный плейлист':`${p.trackIds.length} треков`}</small></span>${icon('chevron-right')}</button>`).join('');
 return `<div class="mobile-settings-shell"><div class="mobile-profile-panel" id="mobileProfilePanel" ${mobileBackdrop?`style="background-image:linear-gradient(90deg,rgba(20,13,33,.70),rgba(20,13,33,.42)),url('${esc(mobileBackdrop)}')"`:''}>
    <label class="mobile-avatar" aria-label="Изменить аватар">${avatar}<span class="avatar-pencil">${icon('edit')}</span><input id="mobileAvatarInput" type="file" accept="image/jpeg,image/png,image/webp"></label>
    <div class="mobile-profile-text"><span class="mobile-profile-kicker">ТВОЯ АТМОСФЕРА</span><h1>ELYSIA</h1><span id="mobileProfileDisplay">${esc(mobileProfileName)}</span></div>
 </div>
 <div class="mobile-settings-quick"><button data-page="library">${icon('music')} Библиотека</button><button data-action="create-playlist">${icon('plus')} Новый плейлист</button></div>
 <div class="mobile-content-heading"><h2>Мои плейлисты</h2><button data-action="create-playlist" aria-label="Создать плейлист">${icon('plus')}</button></div>
 <div class="mobile-settings-playlist-list">${playlistList||'<p class="mobile-muted-p">Создай плейлист для любимой музыки</p>'}</div>
 <div class="mobile-content-heading"><h2>Персонализация</h2></div>
 <div class="mobile-profile-custom">
  <label class="form-label" for="mobileNameInput">Имя профиля</label><input id="mobileNameInput" maxlength="36" class="form-input" value="${esc(mobileProfileName)}" placeholder="Имя профиля">
  <div class="mobile-image-settings-row"><span>${icon('image')}</span><div><strong>Фон профиля</strong><small>Твоя картинка из галереи</small></div><label class="mobile-file-btn">Выбрать<input type="file" id="mobileBackdropInput" accept="image/jpeg,image/png,image/webp"></label></div>
  <button class="mobile-remove-background" id="mobileRemoveBackdrop">Убрать фон профиля</button>
 </div></div>`;
}
function decorateMobilePage(){
 const content=$('#pageContent');if(!content)return;
 if(page==='home'){
  const hero=content.querySelector('.hero');if(hero){hero.insertAdjacentHTML('beforebegin',`<div class="mobile-home-tabs"><button class="active" data-page="home">${icon('home')} Главная</button><button data-page="favorites">${icon('heart')} Любимое</button><button data-page="library">${icon('music')} Библиотека</button></div>`);hero.insertAdjacentHTML('afterend',mobileHomeMarkup());}
 }else if(page==='settings')content.insertAdjacentHTML('afterbegin',mobileSettingsMarkup());
 iconify(content);
}
function updateMobilePlayer(){
 const root=$('#mobileNowPlaying');if(!root)return;
 const t=findTrack(currentId);
 $('#npTitle').textContent=t?.title||'Время музыки';
 $('#npArtist').textContent=t?.artist||'Добавь песню в библиотеку';
 const coverKey=(t?.id||'')+'@'+(t?.cover||'').length+'@'+(t?.cover||'').slice(-25);
 if(mobileLastCoverKey!==coverKey){
  mobileLastCoverKey=coverKey;
  $('#npCover').innerHTML=t?.cover?`<img src="${esc(t.cover)}" alt="Обложка ${esc(t.title)}">`:icon('music');
  $('#npCover').style.background=t?coverGradient(t):'linear-gradient(135deg,#3d2a54,#8b65ac)';
  $('#npBackground').style.backgroundImage=t?.cover?`url("${t.cover}")`:'';
  iconify($('#npCover'));
 }
 const native=!!t&&['file','direct'].includes(t.source);
 const duration=Number.isFinite(audio.duration)&&audio.duration>0?audio.duration:t?.duration||0;
 $('#npSeek').disabled=!native||duration<=0;
 $('#npSeek').value=native&&duration?Math.floor(audio.currentTime/duration*1000):0;
 $('#npElapsed').textContent=native?formatTime(audio.currentTime):'—';
 $('#npDuration').textContent=native?formatTime(duration):'—';
 $('#npLike').disabled=!t;
 $('#npLike').classList.toggle('liked',!!t?.liked);
 $('#npShuffle').classList.toggle('on',shuffle);
 $('#npRepeat').classList.toggle('on',repeat!=='off');
 $('#npVolume').value=settings.volume;
 $('#npVolPercent').textContent=settings.volume+'%';
 $('#npService').hidden=!t||native;
 $('#npVolume').disabled=!native;
 const state=native&&!audio.paused?'pause':'play';
 if(state!==mobileLastPlaybackState){mobileLastPlaybackState=state;$('#npPlay').innerHTML=icon(state);iconify($('#npPlay'));}
 if(!$('#npLyricsPanel').hidden&&t)$('#npLyricsPanel').textContent=t.lyrics||'Для этой песни пока нет текста. Добавь его через «Изменить».';
}
function openMobilePlayer(){
 if(!currentId){openAdd();return;}
 const root=$('#mobileNowPlaying');root.hidden=false;document.body.classList.add('mobile-player-open');
 updateMobilePlayer();iconify(root);
 $('#npClose').focus();
}
function closeMobilePlayer(){
 const root=$('#mobileNowPlaying');if(root)root.hidden=true;document.body.classList.remove('mobile-player-open');
 $('#npLyricsPanel').hidden=true;
}
// Buttons reuse the same audio state and IndexedDB engine as desktop version.
$('#npClose').addEventListener('click',closeMobilePlayer);
$('#npPlay').addEventListener('click',()=>{const t=findTrack(currentId);if(t&&!['file','direct'].includes(t.source)){closeMobilePlayer();openExternalPlayer(t);}else $('#playBtn').click();});
$('#npPrev').addEventListener('click',()=>$('#previousBtn').click());
$('#npNext').addEventListener('click',()=>$('#nextBtn').click());
$('#npShuffle').addEventListener('click',()=>$('#shuffleBtn').click());
$('#npRepeat').addEventListener('click',()=>$('#repeatBtn').click());
$('#npSeek').addEventListener('input',e=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=Number(e.target.value)/1000*audio.duration;});
$('#npVolume').addEventListener('input',e=>{setVolume(e.target.value);updateMobilePlayer();});
$('#npMore').addEventListener('click',()=>{if(currentId)optionsModal(currentId);});
$('#npCover').addEventListener('click',()=>{if(currentId)coverModal(currentId);});
$('#npEdit').addEventListener('click',()=>{if(currentId)optionsModal(currentId);});
$('#npLike').addEventListener('click',async()=>{const t=findTrack(currentId);if(!t)return;t.liked=!t.liked;await saveTrack(t);render();});
$('#npLyricsBtn').addEventListener('click',()=>{
 const el=$('#npLyricsPanel');const t=findTrack(currentId);el.textContent=t?.lyrics||'Текста пока нет. Открой меню «Изменить», чтобы добавить его.';
 el.hidden=!el.hidden;
});
$('#npQueue').addEventListener('click',()=>{closeMobilePlayer();changePage('library');});
$('#npService').addEventListener('click',()=>{const t=findTrack(currentId);if(t){closeMobilePlayer();openExternalPlayer(t);}});
$('#dockTitle').parentElement.addEventListener('click',e=>{if(window.matchMedia('(max-width:650px)').matches)openMobilePlayer();});
$('#dockTitle').parentElement.style.cursor='pointer';
document.addEventListener('click',event=>{
 const btn=event.target.closest('[data-action="play"]');
 if(btn&&window.matchMedia('(max-width:650px)').matches){
  const t=findTrack(btn.dataset.id);
  if(t&&['file','direct'].includes(t.source))requestAnimationFrame(()=>openMobilePlayer());
 }
});
document.addEventListener('input',event=>{
 if(event.target.id==='mobileNameInput'){
  mobileProfileName=event.target.value.slice(0,36);
  try{localStorage.setItem('elysia-mobile-profile',mobileProfileName);}catch{}
  const label=$('#mobileProfileDisplay');if(label)label.textContent=mobileProfileName||'Мой профиль';
 }
});
document.addEventListener('change',async event=>{
 const el=event.target;
 if(!['mobileAvatarInput','mobileBackdropInput'].includes(el.id))return;
 const file=el.files?.[0];if(!file)return;
 try{
  const avatar=el.id==='mobileAvatarInput';
  const data=await imageData(file,avatar?'cover':'hero');
  await put('assets',data,avatar?'mobile-avatar':'mobile-profile-background');
  if(avatar)mobileAvatar=data;else mobileBackdrop=data;
  render();toast(avatar?'Аватар сохранён':'Фон профиля сохранён');
 }catch(err){toast(err.message||'Не удалось сохранить фотографию',true);}
});
document.addEventListener('click',async event=>{
 if(event.target.closest('#mobileRemoveBackdrop')){
  mobileBackdrop='';await del('assets','mobile-profile-background');render();toast('Фон профиля убран');
 }
});
// Native Android WebView back button can dispatch this event.
window.addEventListener('elysia-back',()=>{
 if(!$('#modalBackdrop').hidden){closeModal();return;}
 if(!$('#mobileNowPlaying').hidden){closeMobilePlayer();return;}
 if($('#nowDrawer').classList.contains('open')){drawer(false);return;}
 changePage('home');
});

// If IndexedDB responds before this second script loads, refresh the first mobile view.
setTimeout(()=>{if(db&&page==='home'&&!document.querySelector('.mobile-home'))render();},0);

// Android WebView: target="_blank" must open in the phone's browser instead
// of silently failing in a single-window WebView. Other browsers keep target="_blank".
document.addEventListener('click',event=>{
 if(!/ELYSIAAndroid\/1\.0/.test(navigator.userAgent))return;
 const a=event.target.closest('a[target="_blank"]');if(!a||!a.href)return;
 event.preventDefault();window.location.href=a.href;
});

</script>
